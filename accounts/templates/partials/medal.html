{# Medal badge. Usage: {% include "partials/medal.html" with n="1" %}  (n is shown on the disc) #}
<svg class="tier__medal" viewBox="0 0 100 126" aria-hidden="true" focusable="false">
    <defs>
        <radialGradient id="medal-disc-{{ n }}-{{ uid }}" cx="38%" cy="30%" r="80%">
            <stop offset="0" stop-color="#5a5c60" />
            <stop offset="1" stop-color="#2b2c2f" />
        </radialGradient>
    </defs>
    <polygon points="20,0 40,0 51,30 62,0 82,0 58,54 44,54" fill="#d11d2b" />
    <polygon points="40,0 51,30 62,0 56,0 51,12 46,0" fill="#a8141f" />
    <circle cx="50" cy="86" r="37" fill="url(#medal-disc-{{ n }}-{{ uid }})" />
    <circle cx="50" cy="86" r="32" fill="none" stroke="#74767b" stroke-width="1.2" stroke-dasharray="1.6 2.6" />
    <text x="50" y="102" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="46" font-style="italic" fill="#1d1e20">{{ n }}</text>
</svg>
