{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · HANY Dashboard</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="shortcut icon" href="{% static 'images/testo/logo.png' %}" type="image/x-icon">
    <style>
        :root {
            --dash-bg: #0b0b0c; --dash-panel: #141416; --dash-panel-raised: #1a1a1d;
            --dash-line: rgba(255,255,255,.08); --dash-accent: #d66a1f;
            --dash-text: #f3f1ee; --dash-muted: #9a938c; --dash-danger: #e05c4a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at top, #16130f 0%, #0b0b0c 60%);
            color: var(--dash-text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            padding: 1.5rem;
        }
        .login-card {
            width: 100%; max-width: 380px; background: var(--dash-panel);
            border: 1px solid var(--dash-line); border-radius: 16px; padding: 2rem 1.75rem;
        }
        .login-card__head { text-align: center; margin-bottom: 1.5rem; }
        .login-card__head img { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; }
        .login-card__head h1 { font-size: 1.05rem; margin: .8rem 0 .15rem; }
        .login-card__head p { margin: 0; color: var(--dash-muted); font-size: .82rem; }
        .login-field { margin-bottom: 1rem; }
        .login-field label { display: block; font-size: .8rem; color: var(--dash-muted); margin-bottom: .35rem; }
        .login-field input {
            width: 100%; background: var(--dash-panel-raised); border: 1px solid var(--dash-line);
            color: var(--dash-text); border-radius: 9px; padding: .65rem .75rem; font-size: .92rem;
        }
        .login-field input:focus { outline: none; border-color: var(--dash-accent); }
        .login-error {
            background: rgba(224,92,74,.1); border: 1px solid rgba(224,92,74,.35); color: var(--dash-danger);
            border-radius: 9px; padding: .6rem .8rem; font-size: .82rem; margin-bottom: 1rem;
        }
        .login-btn {
            width: 100%; background: var(--dash-accent); color: #fff; border: 0; border-radius: 9px;
            padding: .7rem; font-size: .92rem; font-weight: 600; cursor: pointer; margin-top: .3rem;
        }
        .login-btn:hover { filter: brightness(1.08); }
        .login-back { display: block; text-align: center; margin-top: 1.25rem; font-size: .8rem; color: var(--dash-muted); text-decoration: none; }
        .login-back:hover { color: var(--dash-text); }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-card__head">
            <img src="{% static 'images/testo/logo.png' %}" alt="HANY">
            <h1>Dashboard sign in</h1>
            <p>Store owner and staff access only.</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="login-error">{{ message }}</div>
        {% endfor %}
        {% elif form.errors %}
        <div class="login-error">Incorrect username or password.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <fieldset {% if locked_out %}disabled{% endif %} style="border:0;padding:0;margin:0;">
            <div class="login-field">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" autocomplete="username" required autofocus>
            </div>
            <div class="login-field">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" autocomplete="current-password" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="login-btn">Sign in</button>
            </fieldset>
        </form>

        <a href="{% url 'store' %}" class="login-back">&larr; Back to the store</a>
    </div>
</body>

</html>
